<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebWorker Schedule Runner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dexie.js -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 曜日選択ボタンのスタイル */
        .day-btn.selected {
            background-color: #2563eb;
            /* blue-600 */
            color: white;
            border-color: #2563eb;
        }

        /* 1分前通知済みのアニメーション */
        .notified-pulse {
            animation: borderPulse 2s infinite;
        }

        @keyframes borderPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(234, 179, 8, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(234, 179, 8, 0);
            }
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-10">
        <div class="flex items-center">
            <h1 class="text-xl font-bold mr-4"><i class="fa-solid fa-clock-rotate-left mr-2"></i>Schedule Runner</h1>
            <!-- 通知許可ボタン -->
            <button id="notifyPermissionBtn"
                class="hidden text-xs bg-white text-blue-600 px-2 py-1 rounded shadow hover:bg-gray-100 transition animate-pulse">
                <i class="fa-regular fa-bell mr-1"></i>通知を許可する
            </button>
        </div>
        <div id="statusIndicator" class="flex items-center text-sm bg-blue-700 px-3 py-1 rounded-full">
            <span class="w-2 h-2 bg-red-400 rounded-full mr-2 animate-pulse" id="workerStatusDot"></span>
            <span id="workerStatusText">Worker 停止中</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar / Form -->
        <aside
            class="w-full md:w-1/3 lg:w-1/4 bg-white p-6 shadow-xl z-20 overflow-y-auto flex flex-col border-r border-gray-200">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">新規スケジュール</h2>

            <form id="scheduleForm" class="space-y-4">
                <div class="relative">
                    <label class="block text-sm font-medium text-gray-700 mb-1">タイトル (任意)</label>
                    <input type="text" id="titleInput" placeholder="例: 定例MTG (ここに招待状をペースト)"
                        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none transition placeholder-gray-400 text-sm">
                    <p class="text-[10px] text-blue-500 mt-1"><i
                            class="fa-solid fa-wand-magic-sparkles mr-1"></i>招待状テキストを貼ると自動入力</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">URL <span
                            class="text-red-500">*</span></label>
                    <input type="url" id="urlInput" required placeholder="https://example.com"
                        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">実行時間 (HH:MM) <span
                            class="text-red-500">*</span></label>
                    <div class="flex items-center gap-2">
                        <!-- 幅を短く調整 (w-32) -->
                        <input type="time" id="timeInput" required
                            class="w-36 p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none transition">

                        <!-- +2分ボタン -->
                        <button type="button" id="addTwoMinBtn"
                            class="text-gray-500 hover:text-blue-600 transition p-2 rounded-full hover:bg-blue-50"
                            title="現在時刻の2分後を設定">
                            <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                            <span class="text-xs font-bold">+2分</span>
                        </button>

                        <span class="text-xs text-gray-400 ml-auto">の1分前に実行</span>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">曜日指定 (複数可)</label>
                    <div class="flex justify-between gap-1 mb-1">
                        <button type="button" data-day="1"
                            class="day-btn flex-1 py-2 text-xs border border-gray-300 rounded hover:bg-gray-100 transition">月</button>
                        <button type="button" data-day="2"
                            class="day-btn flex-1 py-2 text-xs border border-gray-300 rounded hover:bg-gray-100 transition">火</button>
                        <button type="button" data-day="3"
                            class="day-btn flex-1 py-2 text-xs border border-gray-300 rounded hover:bg-gray-100 transition">水</button>
                        <button type="button" data-day="4"
                            class="day-btn flex-1 py-2 text-xs border border-gray-300 rounded hover:bg-gray-100 transition">木</button>
                        <button type="button" data-day="5"
                            class="day-btn flex-1 py-2 text-xs border border-gray-300 rounded hover:bg-gray-100 transition">金</button>
                    </div>
                    <div class="flex justify-end">
                        <button type="button" id="clearDaysBtn"
                            class="text-xs text-gray-500 hover:text-red-500 underline">選択解除</button>
                    </div>
                    <p class="text-[10px] text-gray-500 mt-1">※未選択の場合は「直近の未来（今日か明日）」になります。</p>
                </div>

                <div class="space-y-2 pt-2">
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow transition transform active:scale-95">
                        <i class="fa-solid fa-plus mr-2"></i>追加
                    </button>
                    <!-- リセットボタンの追加 -->
                    <button type="button" id="resetFormBtn"
                        class="w-full bg-white border border-gray-300 hover:bg-gray-100 text-gray-600 font-medium py-1.5 px-4 rounded shadow-sm transition text-sm">
                        <i class="fa-solid fa-eraser mr-2"></i>リセット
                    </button>
                </div>
            </form>

            <div class="mt-8 bg-yellow-50 border-l-4 border-yellow-400 p-4 text-sm text-yellow-700">
                <p class="font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>重要</p>
                <p>自動でタブを開くために、このサイトの<strong>ポップアップを許可</strong>してください。</p>
            </div>
        </aside>

        <!-- Main Content / List -->
        <main class="flex-1 bg-gray-50 p-6 overflow-y-auto relative">

            <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- タスクカードがここに挿入されます -->
                <p class="col-span-full text-center text-gray-400 py-10">タスクがありません</p>
            </div>

            <!-- Toast Notification Area -->
            <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
        </main>
    </div>

    <!-- Web Worker Script (Inline Blob) -->
    <script id="worker-script" type="javascript/worker">
        let tasks = [];
        let lastRefreshTime = 0;

        self.onmessage = function(e) {
            if (e.data.type === 'UPDATE_TASKS') {
                tasks = e.data.tasks;
                tasks.sort((a, b) => a.targetTime - b.targetTime);
            }
        };

        // 1秒ごとにチェック
        setInterval(() => {
            const now = Date.now();
            const executedTaskIds = [];

            // --- 30秒ごとのUIリフレッシュ通知 ---
            if (now - lastRefreshTime >= 30000) {
                self.postMessage({ type: 'REFRESH_UI' });
                lastRefreshTime = now;
            }

            if (tasks.length === 0) return;

            tasks.forEach(task => {
                // --- A. 1分前通知チェック (60000ms前) ---
                if (!task.notifiedBefore && now >= (task.targetTime - 60000) && now < task.targetTime) {
                    self.postMessage({ type: 'PRE_NOTIFY', task: task });
                    task.notifiedBefore = true; 
                }

                // --- B. 本番実行チェック (目標時刻) ---
                if (now >= task.targetTime) {
                    self.postMessage({ type: 'EXECUTE', task: task });
                    executedTaskIds.push(task.id);
                }
            });

            // 実行済みタスクをリストから除外
            if (executedTaskIds.length > 0) {
                tasks = tasks.filter(t => !executedTaskIds.includes(t.id));
            }

        }, 1000);
    </script>

    <script>
        // --- 1. Dexie Database Setup ---
        const db = new Dexie("ScheduleDB");
        db.version(2).stores({
            tasks: "++id, title, url, targetTime, displayTime, dayInfo, selectedDays, notifiedBefore"
        });
        db.version(1).stores({
            tasks: "++id, title, url, targetTime, displayTime, dayInfo, selectedDays"
        });

        // --- 2. State & Variables ---
        let worker;
        const taskListEl = document.getElementById('taskList');
        const formEl = document.getElementById('scheduleForm');
        const titleInput = document.getElementById('titleInput');
        const dayBtns = document.querySelectorAll('.day-btn');
        const notifyPermissionBtn = document.getElementById('notifyPermissionBtn');
        let selectedDays = []; // 0=Sun, 6=Sat

        // メインスレッド側でタスクリストをキャッシュ（UI定期更新用）
        let cachedTasks = [];

        // --- 3. Web Worker Initialization ---
        function initWorker() {
            const blob = new Blob([document.getElementById('worker-script').textContent], { type: "text/javascript" });
            worker = new Worker(window.URL.createObjectURL(blob));

            worker.onmessage = async function (e) {
                if (e.data.type === 'PRE_NOTIFY') {
                    // 1分前処理
                    handlePreNotify(e.data.task);
                } else if (e.data.type === 'EXECUTE') {
                    // 本番処理
                    handleFinalExecute(e.data.task);
                } else if (e.data.type === 'REFRESH_UI') {
                    // UIリフレッシュ（バッジ更新 + スタイル更新）
                    updateNextTaskBadge();
                    updateTaskStyles();
                }
            };

            updateWorkerStatus(true);
            syncTasksToWorker();
            checkNotificationPermission();
        }

        function updateWorkerStatus(isRunning) {
            const dot = document.getElementById('workerStatusDot');
            const text = document.getElementById('workerStatusText');
            if (isRunning) {
                dot.classList.remove('bg-red-400');
                dot.classList.add('bg-green-400');
                text.textContent = "監視中 (Worker Running)";
            } else {
                dot.classList.remove('bg-green-400');
                dot.classList.add('bg-red-400');
                text.textContent = "停止中";
            }
        }

        // --- 4. Core Logic ---

        async function syncTasksToWorker() {
            const tasks = await db.tasks.toArray();
            // キャッシュ更新
            cachedTasks = tasks;
            worker.postMessage({ type: 'UPDATE_TASKS', tasks: tasks });
            renderTasks(tasks);
        }

        // --- 1分前のアクション（URL開く・削除しない） ---
        async function handlePreNotify(task) {
            console.log(`[1分前通知] ${task.title}`);
            playNotificationSound(true);
            triggerNotificationAndUrl(task, "[まもなく開始]", true);
            await db.tasks.update(task.id, { notifiedBefore: true });
            await syncTasksToWorker();
        }

        // --- 定刻のアクション（URL開かない・定期なら次回更新） ---
        async function handleFinalExecute(taskData) {
            console.log(`[定刻実行] ${taskData.title}`);

            const latestTask = await db.tasks.get(taskData.id);
            if (!latestTask) return;

            // 1. 音再生 (2回連続で鳴らす)
            playNotificationSound(false);

            // 2. 通知のみ
            triggerNotificationAndUrl(latestTask, "[お時間です]", false);

            // 3. 次回更新 or 削除の判定
            if (Array.isArray(latestTask.selectedDays) && latestTask.selectedDays.length > 0) {
                // 定期実行の場合、次回を計算
                const nextTime = calculateTargetTime(latestTask.displayTime, latestTask.selectedDays);
                const nextDate = new Date(nextTime);
                const nextStr = `${nextDate.getMonth() + 1}/${nextDate.getDate()} ${nextDate.getHours().toString().padStart(2, '0')}:${nextDate.getMinutes().toString().padStart(2, '0')}`;

                await db.tasks.update(latestTask.id, {
                    targetTime: nextTime,
                    notifiedBefore: false
                });
                showToast(`次回の日時(${nextStr})に更新しました`, 'info');

            } else {
                // 単発の場合 -> 削除
                await db.tasks.delete(latestTask.id);
                showToast('完了したタスクを削除しました', 'info');
            }

            await syncTasksToWorker();
        }

        // 共通アクション: 通知とURLオープン
        function triggerNotificationAndUrl(task, prefix = "", allowAutoOpen = true) {
            const notificationGranted = ("Notification" in window) && (Notification.permission === "granted");
            const displayTitle = `${prefix} ${task.title || 'スケジュール'}`;

            if (notificationGranted) {
                sendBrowserNotification(task, displayTitle);
                showToast(`通知: ${displayTitle}`, 'info');
            } else {
                if (allowAutoOpen) {
                    try {
                        const newWindow = window.open(task.url, '_blank');
                        if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                            showToast(`ポップアップブロック: ${displayTitle}`, 'error');
                        } else {
                            showToast(`実行: ${displayTitle}`, 'success');
                        }
                    } catch (e) {
                        console.error(e);
                        showToast('URLを開けませんでした', 'error');
                    }
                } else {
                    showToast(`${displayTitle} (URLは開きません)`, 'success');
                }
            }
        }

        // ダブルクリック用のヘルパー関数
        function openTaskUrl(url) {
            if (!url) return;
            try {
                const newWindow = window.open(url, '_blank');
                if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                    showToast(`ポップアップがブロックされました: ${url}`, 'error');
                } else {
                    showToast('URLを開きました', 'success');
                }
            } catch (e) {
                console.error(e);
                showToast('URLを開けませんでした', 'error');
            }
        }

        // タスククリックでフォームにコピー
        function loadTaskToForm(taskId) {
            const task = cachedTasks.find(t => t.id === taskId);
            if (!task) return;

            // フォームの値をセット
            titleInput.value = task.title || '';
            document.getElementById('urlInput').value = task.url || '';
            document.getElementById('timeInput').value = task.displayTime || '';

            // 曜日ボタンのセット
            selectedDays = [];
            if (Array.isArray(task.selectedDays)) {
                selectedDays = [...task.selectedDays];
            }

            // ボタンのスタイル更新
            dayBtns.forEach(btn => {
                const day = parseInt(btn.dataset.day);
                if (selectedDays.includes(day)) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });

            showToast('フォームにタスク情報をコピーしました', 'info');
            // フォームを強調
            formEl.classList.add('ring-2', 'ring-blue-300');
            setTimeout(() => formEl.classList.remove('ring-2', 'ring-blue-300'), 500);
        }

        // リセット処理
        function resetForm() {
            titleInput.value = '';
            document.getElementById('urlInput').value = '';
            // 時間はクリアせず、現在時刻を入れ直すと使いやすいかも（あるいはクリア）
            // ここでは現在時刻セット
            const now = new Date();
            const currentParams = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('timeInput').value = currentParams;

            selectedDays = [];
            dayBtns.forEach(btn => btn.classList.remove('selected'));

            showToast('入力をクリアしました', 'info');
        }

        function sendBrowserNotification(task, titleOverride) {
            if (!("Notification" in window)) return;
            if (Notification.permission === "granted") {
                const options = {
                    body: `${task.url}\nクリックして開く`,
                    requireInteraction: true
                };
                try {
                    const notification = new Notification(titleOverride, options);
                    notification.onclick = function (event) {
                        event.preventDefault();
                        window.open(task.url, '_blank');
                        notification.close();
                    };
                } catch (e) { console.error(e); }
            }
        }

        function checkNotificationPermission() {
            if (!("Notification" in window)) return;
            if (Notification.permission === "default") {
                notifyPermissionBtn.classList.remove('hidden');
                notifyPermissionBtn.addEventListener('click', () => {
                    Notification.requestPermission().then((permission) => {
                        if (permission === "granted") {
                            notifyPermissionBtn.classList.add('hidden');
                            showToast("通知が許可されました", "success");
                        }
                    });
                });
            } else if (Notification.permission === "granted") {
                notifyPermissionBtn.classList.add('hidden');
            }
        }

        function playNotificationSound(isPreNotify) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();

            const playTone = (freq, startTime, duration) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime + startTime;
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.1, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.start(now);
                osc.stop(now + duration);
            };

            if (isPreNotify) {
                playTone(659.25, 0, 1.5);
                playTone(523.25, 0.4, 1.5);
            } else {
                playTone(523.25, 0, 2.0);
                playTone(659.25, 0.1, 2.0);
                playTone(783.99, 0.2, 2.0);
                playTone(523.25, 1.2, 2.0);
                playTone(659.25, 1.3, 2.0);
                playTone(783.99, 1.4, 2.0);
            }
        }

        function calculateTargetTime(timeStr, daysArray) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            const now = new Date();
            const baseTime = new Date(now.getTime() + 1000);

            for (let i = 0; i <= 7; i++) {
                let candidate = new Date(baseTime.getTime());
                candidate.setDate(baseTime.getDate() + i);
                candidate.setHours(hours, minutes, 0, 0);

                if (candidate <= baseTime) {
                    continue;
                }

                const candidateDay = candidate.getDay();

                if (!Array.isArray(daysArray) || daysArray.length === 0) {
                    return candidate.getTime();
                } else {
                    if (daysArray.includes(candidateDay)) {
                        return candidate.getTime();
                    }
                }
            }

            const fallback = new Date();
            fallback.setDate(now.getDate() + 1);
            fallback.setHours(hours, minutes, 0, 0);
            return fallback.getTime();
        }

        // --- 5. UI Rendering ---

        // バッジ更新専用関数 (位置と内容の更新)
        function updateNextTaskBadge() {
            const container = document.getElementById('nextTaskBadgeContainer');
            const spacer = document.getElementById('badgeSpacer');
            if (!container || !spacer) return;

            const nowTs = Date.now();
            const todayStr = new Date().toDateString();

            // 今日のタスクを抽出・ソート
            const todayTasks = cachedTasks.filter(t => {
                const d = new Date(t.targetTime);
                return d.toDateString() === todayStr;
            }).sort((a, b) => a.targetTime - b.targetTime);

            // 直近未来のタスクを探す
            const nextTask = todayTasks.find(t => t.targetTime > nowTs);

            if (nextTask) {
                const diffMs = nextTask.targetTime - nowTs;
                const diffMins = Math.ceil(diffMs / (1000 * 60));

                let timeText = "";
                let colorClass = "bg-blue-100 text-blue-700";
                let iconClass = "fa-hourglass-half text-blue-500";

                // 10分未満なら警告色に変更
                if (diffMins < 10) {
                    colorClass = "bg-yellow-100 text-yellow-700 ring-2 ring-yellow-400 border-transparent";
                    iconClass = "fa-solid fa-bell fa-shake text-yellow-600";
                }

                // 1時間以上かどうかで表示を分岐
                if (diffMins >= 60) {
                    const hours = Math.floor(diffMins / 60);
                    const mins = diffMins % 60;
                    timeText = `あと<span class="font-bold text-lg mx-1">${hours}</span>時間<span class="font-bold text-lg mx-1">${mins}</span>分で開始予定`;

                    // 1時間以上: スペーサーを最大伸長 (右寄せ)
                    spacer.style.flexGrow = 1;
                } else {
                    timeText = `あと<span class="font-bold text-lg mx-1">${diffMins}</span>分で開始予定`;

                    // 1時間未満: スペーサーの伸縮率をミリ秒単位で減らす (左に近づく)
                    // 60分(3600000ms)で1.0、0msで0.0 になるように計算
                    const maxMs = 60 * 60 * 1000;
                    spacer.style.flexGrow = Math.max(0, diffMs / maxMs);
                }

                container.innerHTML = `<span class="ml-2 text-sm font-normal px-3 py-1 rounded-full animate-pulse shadow-sm flex items-center whitespace-nowrap transition-colors duration-500 ${colorClass}">
                    <i class="${iconClass} mr-2"></i>
                    ${timeText}
                </span>`;
                container.style.display = 'block';
            } else {
                container.innerHTML = '';
                container.style.display = 'none';
                spacer.style.flexGrow = 1;
            }
        }

        // タスクカードのスタイルのみを更新する関数
        function updateTaskStyles() {
            const now = Date.now();
            cachedTasks.forEach(task => {
                const el = document.getElementById(`task-card-${task.id}`);
                if (!el) return;

                const isExpired = task.targetTime < now;
                const isRegular = Array.isArray(task.selectedDays) && task.selectedDays.length > 0;

                // 残り時間計算
                const diffMs = task.targetTime - now;
                const diffMins = Math.ceil(diffMs / (1000 * 60));
                const isUrgent = diffMins > 0 && diffMins < 10;

                let bgClass = 'bg-white';
                let borderClass = 'border-gray-200';

                if (isExpired) {
                    bgClass = 'bg-gray-100';
                    borderClass = 'border-gray-300';
                } else if (isUrgent) {
                    // 緊急タスク（10分未満）: 薄い黄色
                    bgClass = 'bg-yellow-50';
                    borderClass = 'border-yellow-200 ring-2 ring-yellow-100';
                } else if (isRegular) {
                    bgClass = 'bg-green-50';
                    borderClass = 'border-green-200';
                } else {
                    bgClass = 'bg-blue-50';
                    borderClass = 'border-blue-200';
                }

                let cardClass = `${bgClass} ${borderClass} hover:shadow-md rounded-lg shadow-sm border p-4 fade-in transition relative group cursor-pointer`;

                if (isExpired) {
                    cardClass += ' opacity-80';
                }

                const isPreNotified = task.notifiedBefore && !isExpired;
                if (isPreNotified) {
                    cardClass += ' border-yellow-400 notified-pulse';
                }

                el.className = cardClass;
            });
        }

        function renderTasks(tasks) {
            taskListEl.innerHTML = '';

            if (tasks.length === 0) {
                taskListEl.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 flex flex-col items-center">
                    <i class="fa-solid fa-clipboard-check text-4xl mb-4"></i>
                    <p>実行待ちのスケジュールはありません</p>
                </div>`;
                return;
            }

            const now = new Date();
            const todayStr = now.toDateString();
            const todayTasks = [];
            const otherTasks = [];

            tasks.forEach(task => {
                const taskDate = new Date(task.targetTime);
                if (taskDate.toDateString() === todayStr) {
                    todayTasks.push(task);
                } else {
                    otherTasks.push(task);
                }
            });

            todayTasks.sort((a, b) => a.targetTime - b.targetTime);
            otherTasks.sort((a, b) => a.targetTime - b.targetTime);

            const createCard = (task) => {
                const dateObj = new Date(task.targetTime);
                const dayName = ['日', '月', '火', '水', '木', '金', '土'][dateObj.getDay()];
                const dateStr = `${dateObj.getMonth() + 1}/${dateObj.getDate()}(${dayName}) ${dateObj.getHours().toString().padStart(2, '0')}:${dateObj.getMinutes().toString().padStart(2, '0')}`;

                const isExpired = dateObj.getTime() < Date.now();
                const isPreNotified = task.notifiedBefore && !isExpired;
                const isRegular = Array.isArray(task.selectedDays) && task.selectedDays.length > 0;

                // 残り時間の計算
                const diffMs = task.targetTime - Date.now();
                const diffMins = Math.ceil(diffMs / (1000 * 60));
                const isUrgent = diffMins > 0 && diffMins < 10;

                let bgClass = 'bg-white';
                let borderClass = 'border-gray-200';

                if (isExpired) {
                    bgClass = 'bg-gray-100';
                    borderClass = 'border-gray-300';
                } else if (isUrgent) {
                    bgClass = 'bg-yellow-50';
                    borderClass = 'border-yellow-200 ring-2 ring-yellow-100';
                } else if (isRegular) {
                    bgClass = 'bg-green-50';
                    borderClass = 'border-green-200';
                } else {
                    bgClass = 'bg-blue-50';
                    borderClass = 'border-blue-200';
                }

                let cardClass = `${bgClass} ${borderClass} hover:shadow-md`;

                if (isExpired) {
                    cardClass += ' opacity-80';
                }

                if (isPreNotified) {
                    cardClass += ' border-yellow-400 notified-pulse';
                }

                const textColor = isExpired ? 'text-gray-500' : 'text-gray-800';

                let statusBadge = '';
                if (isExpired) {
                    statusBadge = `<span class="bg-red-100 text-red-600 text-xs font-bold px-2 py-0.5 rounded ml-2">期限切れ</span>`;
                } else if (isPreNotified) {
                    statusBadge = `<span class="bg-yellow-100 text-yellow-700 text-xs font-bold px-2 py-0.5 rounded ml-2"><i class="fa-solid fa-bell mr-1"></i>1分前通知済</span>`;
                }

                const titleHtml = task.title
                    ? `<div class="font-bold ${textColor} mb-1 truncate">${task.title}</div>`
                    : `<div class="font-bold ${isExpired ? 'text-gray-400' : 'text-gray-400'} mb-1 italic">No Title</div>`;

                const div = document.createElement('div');
                // IDを付与して後からスタイル更新できるようにする
                div.id = `task-card-${task.id}`;
                div.className = `${cardClass} rounded-lg shadow-sm border p-4 fade-in transition relative group cursor-pointer`;
                div.setAttribute('ondblclick', `openTaskUrl('${task.url}')`);
                div.setAttribute('onclick', `loadTaskToForm(${task.id})`);
                div.setAttribute('title', 'クリック: 編集 / ダブルクリック: URLを開く');

                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center">
                            <span class="${isExpired ? 'bg-gray-200 text-gray-600' : (isRegular ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800')} text-xs font-semibold px-2.5 py-0.5 rounded">
                                <i class="fa-regular fa-clock mr-1"></i>${dateStr}
                            </span>
                            ${statusBadge}
                        </div>
                        <button onclick="event.stopPropagation(); deleteTask(${task.id})" class="text-gray-400 hover:text-red-500 transition" title="削除">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    ${titleHtml}
                    <div class="truncate text-gray-600 text-sm mb-2">
                        <i class="fa-solid fa-link mr-1 text-xs"></i>${task.url}
                    </div>
                    <div class="text-xs text-gray-400 border-t ${isExpired ? 'border-gray-200' : (isRegular ? 'border-green-200' : 'border-blue-200')} pt-2 mt-2">
                        設定: ${task.dayInfo}
                    </div>
                `;
                return div;
            };

            if (todayTasks.length > 0) {
                const title = document.createElement('h3');
                title.className = "col-span-full text-lg font-bold text-blue-600 mt-2 mb-2 border-b-2 border-blue-100 pb-1 flex items-center w-full";
                // スペーサーとバッジコンテナを追加
                title.innerHTML = `
                    <div class="flex items-center w-full">
                        <i class="fa-solid fa-calendar-day mr-2"></i>今日の予定
                        <div id="badgeSpacer" class="transition-all duration-1000 ease-in-out"></div>
                        <span id="nextTaskBadgeContainer" style="display:none"></span>
                    </div>
                `;
                taskListEl.appendChild(title);
                todayTasks.forEach(task => taskListEl.appendChild(createCard(task)));
            }

            if (otherTasks.length > 0) {
                if (todayTasks.length > 0) {
                    const sep = document.createElement('div');
                    sep.className = "col-span-full border-t-2 border-dashed border-gray-300 my-6 relative h-4";
                    sep.innerHTML = '<span class="absolute top-[-14px] left-1/2 transform -translate-x-1/2 bg-gray-50 px-2 text-gray-400 text-sm font-medium">以降の予定</span>';
                    taskListEl.appendChild(sep);
                } else {
                    const title = document.createElement('h3');
                    title.className = "col-span-full text-lg font-bold text-gray-500 mt-2 mb-2 border-b pb-1 flex items-center";
                    title.innerHTML = '<i class="fa-solid fa-calendar mr-2"></i>今後の予定';
                    taskListEl.appendChild(title);
                }
                otherTasks.forEach(task => taskListEl.appendChild(createCard(task)));
            }

            updateNextTaskBadge();
        }

        async function deleteTask(id) {
            if (!confirm('このスケジュールを削除しますか？')) return;
            await db.tasks.delete(id);
            await syncTasksToWorker();
            showToast('削除しました', 'info');
        }

        // --- 6. Event Listeners & Smart Paste ---

        // +2分ボタン
        document.getElementById('addTwoMinBtn').addEventListener('click', () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() + 2);
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('timeInput').value = timeStr;
            const btn = document.getElementById('addTwoMinBtn');
            btn.classList.add('text-blue-600', 'scale-110');
            setTimeout(() => btn.classList.remove('text-blue-600', 'scale-110'), 200);
        });

        // リセットボタンのイベントリスナー
        document.getElementById('resetFormBtn').addEventListener('click', resetForm);

        dayBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const day = parseInt(btn.dataset.day);
                if (selectedDays.includes(day)) {
                    selectedDays = selectedDays.filter(d => d !== day);
                    btn.classList.remove('selected');
                } else {
                    selectedDays.push(day);
                    btn.classList.add('selected');
                }
            });
        });

        document.getElementById('clearDaysBtn').addEventListener('click', () => {
            selectedDays = [];
            dayBtns.forEach(btn => btn.classList.remove('selected'));
        });

        titleInput.addEventListener('paste', (e) => {
            const pasteText = (e.clipboardData || window.clipboardData).getData('text');
            const urlMatch = pasteText.match(/(https?:\/\/\S+|meet\.google\.com\/\S+)/);
            const timeMatch = pasteText.match(/(午後|午前)?\s*(\d{1,2}):(\d{2})/);

            if (urlMatch && timeMatch) {
                e.preventDefault();
                const lines = pasteText.split('\n').filter(line => line.trim() !== '');
                const titleCandidate = lines[0] || '';
                titleInput.value = titleCandidate;

                let url = urlMatch[0];
                if (url.startsWith('meet.google.com')) {
                    url = 'https://' + url;
                }
                document.getElementById('urlInput').value = url;

                let period = timeMatch[1];
                let hour = parseInt(timeMatch[2]);
                let minute = timeMatch[3];

                if (period === '午後' && hour < 12) {
                    hour += 12;
                } else if (period === '午前' && hour === 12) {
                    hour = 0;
                }

                const timeStr = `${hour.toString().padStart(2, '0')}:${minute}`;
                document.getElementById('timeInput').value = timeStr;

                showToast('スマート貼り付け: 情報を自動入力しました', 'success');

                formEl.classList.add('ring-2', 'ring-green-400');
                setTimeout(() => formEl.classList.remove('ring-2', 'ring-green-400'), 500);
            }
        });

        formEl.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = titleInput.value.trim();
            const url = document.getElementById('urlInput').value;
            const timeStr = document.getElementById('timeInput').value;

            if (!url || !timeStr) return;

            const targetTime = calculateTargetTime(timeStr, selectedDays);

            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
            let dayInfo = "";
            if (selectedDays.length === 0) {
                dayInfo = "指定なし (最短日時)";
            } else {
                const sortedDays = [...selectedDays].sort();
                dayInfo = "指定: " + sortedDays.map(d => dayNames[d]).join('・');
            }

            const newTask = {
                title: title,
                url: url,
                targetTime: targetTime,
                displayTime: timeStr,
                dayInfo: dayInfo,
                selectedDays: [...selectedDays],
                notifiedBefore: false
            };

            await db.tasks.add(newTask);
            await syncTasksToWorker();

            titleInput.value = '';
            document.getElementById('urlInput').value = '';
            showToast('スケジュールを追加しました', 'success');
        });

        window.addEventListener('beforeunload', (e) => {
            e.preventDefault();
            e.returnValue = '';
            return 'スケジュール監視が停止します。よろしいですか？';
        });

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = {
                'success': 'bg-green-500',
                'error': 'bg-red-500',
                'info': 'bg-gray-700'
            };
            toast.className = `${colors[type]} text-white text-sm py-2 px-4 rounded shadow-lg fade-in flex items-center`;
            toast.innerHTML = `<span>${message}</span>`;

            const container = document.getElementById('toastContainer');
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const now = new Date();
        const currentParams = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('timeInput').value = currentParams;

        // Start App
        initWorker();
        // Make global for onclick
        window.deleteTask = deleteTask;
        window.openTaskUrl = openTaskUrl;
        window.loadTaskToForm = loadTaskToForm;

    </script>
</body>
