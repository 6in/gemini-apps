    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- アイコンコンポーネント (Lucide互換 - Inline SVG) ---

                <path d="M18 6 6 18" /><path d="m6 6 12 12" />

            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

        const CheckCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><path d="m9 11 3 3L22 4" />

        const BookOpen = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

            </svg>
        );

        // --- データ定義 ---
        const TECHNIQUES = [
            // --- 第1部：すぐにアイデアがほしいとき ---
            // 第1章 AI特有の力
            {
                id: 1, chapter: 1, title: "多様な特徴 (バイオミミクリー)", 
                description: "生物の特徴を強制的に組み合わせて、予想外のアイデアを生み出す。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：新しい傘のアイデア" }],
                template: "まず、特徴が異なる動物や生物を10個あげてください。\n次にその動物から連想できる特徴や機能を各10個あげてください。\n最後に、連想した単語と組み合わせて有益な機能を持つ「{{topic}}」のアイデアを7つ考えてください。\n「動物・生物」が持つ機能や特徴をヒントにして、アイデアを発想します。"
            },
            {
                id: 2, chapter: 1, title: "10倍の目標", 
                description: "目標を極端に高く設定することで、既存の延長線上にない解決策を探る。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：売上を上げる施策" }],
                template: "本来の発想のお題「{{topic}}」に含まれる目標を10倍高い目標にしたお題を生成してください。\n次にその目標が実現している状態を7つ連想してください。\n最後に各々の状態を切り口にして「{{topic}}」のアイデアを考えてください。"
            },
            {
                id: 3, chapter: 1, title: "制約なき発想", 
                description: "予算や技術などの制約を一切無視して、自由な発想を広げる。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：理想のオフィス環境" }],
                template: "エネルギー、資金、技術力、法規制、倫理観などの制約が一切ないとしたら、「{{topic}}」についてどのようなアイデアが考えられますか？\nSF的でも魔法のようでも構いません。常識外れのアイデアを10個出してください。"
            },
            {
                id: 4, chapter: 1, title: "未来からの視点 (バックキャスティング)", 
                description: "成功した未来から逆算して、現在やるべきことを考える。",
                inputs: [
                    { id: "topic", label: "お題", placeholder: "例：新規事業の立ち上げ" },
                    { id: "years", label: "何年後？", placeholder: "例：10年後" }
                ],
                template: "今は{{years}}の未来です。「{{topic}}」は大成功を収め、社会に定着しています。\nなぜ成功したのか、どのような経緯で普及したのか、成功の要因となった重要な決断は何だったのかを、過去（現在）を振り返る形式で具体的に語ってください。"
            },
            {
                id: 5, chapter: 1, title: "各種専門家の案", 
                description: "AIに複数の専門家のペルソナを与え、多角的な視点で案を出させる。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：地域活性化のイベント" }],
                template: "多数の専門家（クリエイティブな専門家、技術専門家、ビジネス専門家、学術研究者、社会科学者、ユーザー、ディスラプター、ユーモアのセンスを持つ人々、冒険家）として、「{{topic}}」について具体的な案を考えてください。\nそれぞれの視点からユニークな提案をお願いします。"
            },
            {
                id: 6, chapter: 1, title: "バイアスブレーカー", 
                description: "人間の思考の偏り（バイアス）を指摘させ、逆の視点を持つ。",
                inputs: [{ id: "idea", label: "現在の考え", placeholder: "例：若者向けにはSNSマーケティングが必須だ" }],
                template: "「{{idea}}」という考えに含まれている認知バイアスや思い込みを指摘してください。\nまた、その逆の視点や、全く異なる前提に立った場合のアプローチを提案してください。"
            },

            // 第2章 自由な発想
            {
                id: 7, chapter: 2, title: "関連する要素", 
                description: "連想ゲームのように要素を広げ、意外な組み合わせを見つける。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：リラックスできるカフェ" }],
                template: "「{{topic}}」から連想できる単語を30個挙げてください。\n次に、「{{topic}}」とは一見関係が薄そうな単語を100個リストアップしてください。\nそれらをランダムに組み合わせて、意外性のある「{{topic}}」のアイデアを10個生成してください。"
            },
            {
                id: 8, chapter: 2, title: "広い観点", 
                description: "6つの観点（人、モノ、プロセス等）から網羅的に考える。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：ゴミを減らす方法" }],
                template: "広くアイデアを出すには以下に示す6観点が役立ちます。\n1. 人（主体、客体、立場、能力、市場...）\n2. モノ（製品、素材、設備...）\n3. プロセス（時間、場所、方法、量...）\n4. 環境（自然、社会、経済...）\n5. 意味・価値（機能、情緒、象徴...）\n6. 五感（視覚、聴覚、触覚...）\n\nこれらを参考にして、「{{topic}}」について多様なアイデアを生成してください。"
            },
            {
                id: 9, chapter: 2, title: "ランダムな単語", 
                description: "無関係な単語を強制的に結びつけ、思考のジャンプを起こす。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：新しい文房具" }],
                template: "全く無関係な名詞をランダムに5つ選出してください。\nそれぞれの単語の持つイメージや特性を無理やり「{{topic}}」と結びつけて、斬新なアイデアを考えてください。"
            },
            {
                id: 10, chapter: 2, title: "常識の逆転", 
                description: "業界の常識を洗い出し、それを逆転させる。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：レストランのサービス" }],
                template: "「{{topic}}」における常識や当たり前と思われていることを10個リストアップしてください。\n次に、それらをあえて「逆転」させたり「否定」したりすることで生まれる新しいアイデアを考えてください。"
            },
            {
                id: 11, chapter: 2, title: "子供の視点", 
                description: "純粋で好奇心旺盛な子供の視点で問い直す。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：会議の進め方" }],
                template: "あなたは好奇心旺盛で、忖度を知らない5歳の子供です。\n「{{topic}}」について、大人が気づかないような素朴な疑問や、「なんでこうしないの？」という提案を5つ話してください。"
            },
            {
                id: 12, chapter: 2, title: "制約の活用", 
                description: "あえて厳しい制約を設けることで、創造的な工夫を引き出す。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：商品開発" }, { id: "constraint", label: "制約", placeholder: "例：予算0円で、または3日以内で" }],
                template: "「{{topic}}」のアイデアを考えますが、ここではあえて「{{constraint}}」という厳しい制約を設けます。\nこの制約があるからこそ生まれる、ユニークで工夫に満ちた解決策を5つ提案してください。"
            },

            // 第3章 ロジカルな発想
            {
                id: 13, chapter: 3, title: "工夫のパターン (TRIZ)", 
                description: "40の発明原理を用いて、技術的・物理的な矛盾を解決する。",
                inputs: [{ id: "topic", label: "お題・課題", placeholder: "例：スマホのバッテリー持ち" }],
                template: "TRIZの40の発明原理の中から、「{{topic}}」の解決に役立ちそうな原理を5つ選び、それぞれに基づいた具体的なアイデアを出してください。"
            },
            {
                id: 14, chapter: 3, title: "理想の状態 (IFR)", 
                description: "コストや害がゼロで、機能が無限大の「究極の理想」を定義する。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：移動手段" }],
                template: "「{{topic}}」における究極の理想解（Ideal Final Result）を定義してください。\nコストや害がゼロで、メリットが最大化された状態です。\nその理想状態に少しでも近づくための現実的なアプローチを3段階で提案してください。"
            },
            {
                id: 15, chapter: 3, title: "未来の変化因子", 
                description: "将来起こりうる変化を予測し、現在に活かす。",
                inputs: [{ id: "topic", label: "お題", placeholder: "例：教育ビジネス" }],
                template: "「{{topic}}」に関連する分野で、今後10年間に起こりうる技術的、社会的、経済的な変化因子を5つ挙げてください。\nそれぞれの変化が「{{topic}}」にどのような影響を与え、どのような新しい機会を生むか解説してください。"
            },
            {
                id: 16, chapter: 3, title: "SCAMPER法", 
                description: "7つの変形操作で既存のアイデアを改変する。",
                inputs: [{ id: "idea", label: "既存のアイデア", placeholder: "例：ハンバーガー" }],
                template: "「{{idea}}」に対して、SCAMPER法の各要素（Substitute, Combine, Adapt, Modify, Put to other uses, Eliminate, Reverse）を適用して新しいアイデアを出してください。"
            },
            {
                id: 17, chapter: 3, title: "マトリクス分析", 
                description: "2つの軸でマトリクスを作り、空白領域（ブルーオーシャン）を探す。",
                inputs: [
                    { id: "axis1", label: "軸1", placeholder: "例：価格（高・低）" },
                    { id: "axis2", label: "軸2", placeholder: "例：機能（シンプル・多機能）" },
                    { id: "topic", label: "分析対象", placeholder: "例：市場のノートPC" }
                ],
                template: "「{{topic}}」について、「{{axis1}}」を横軸、「{{axis2}}」を縦軸にとったマトリクスを作成してください。\n各象限に既存の事例を配置し、空いている象限（ブルーオーシャン）があれば、そこにどのような可能性がありますか？"
            },

            // --- 第2部：アイデアを磨きたいとき ---
            // 第4章 発展
            {
                id: 18, chapter: 4, title: "新しい地平の探索", 
                description: "現在のアイデア群の偏りを分析し、欠けている視点を指摘する。",
                inputs: [{ id: "ideas", label: "アイデア群", type: "textarea", placeholder: "アイデアリスト..." }],
                template: "以下のアイデア群を分析してください。\n{{ideas}}\n\nこれらのアイデアに共通する傾向（偏り）は何ですか？\nまた、まだ考えられていない方向性（空白領域）や、欠落している視点を見つけ、そこを埋める新しいアイデアを提案してください。"
            },
            {
                id: 19, chapter: 4, title: "着想の良いところ", 
                description: "否定せずにまずは褒め、その上で発展させる。",
                inputs: [{ id: "idea", label: "自信のないアイデア", type: "textarea", placeholder: "アイデア..." }],
                template: "次のアイデアの「良いところ」を4つ挙げてください。\nまた、このアイデアをさらに発展させるために考慮すべき課題やヒントを1つだけ優しくコメントしてください。\n\nアイデア：{{idea}}"
            },
            {
                id: 20, chapter: 4, title: "シナリオライティング", 
                description: "アイデアが実際に使われているシーンを物語として描く。",
                inputs: [
                    { id: "idea", label: "アイデア", placeholder: "例：全自動朝食メーカー" },
                    { id: "target", label: "主人公", placeholder: "例：忙しい独身サラリーマン" }
                ],
                template: "「{{target}}」が「{{idea}}」を利用している日常のシナリオを、物語風に書いてください。\n利用前、利用中、利用後の感情の変化や、具体的なメリットが伝わるように描写してください。"
            },
            {
                id: 21, chapter: 4, title: "感情の分析", 
                description: "ユーザーが抱くであろう感情をポジティブ・ネガティブ両面から分析する。",
                inputs: [{ id: "idea", label: "アイデア", placeholder: "アイデア..." }],
                template: "「{{idea}}」というアイデアに対して、ユーザーが抱く可能性のある「ポジティブな感情（喜び、安心など）」と「ネガティブな感情（不安、面倒など）」をそれぞれ3つずつ深く分析してください。"
            },
            {
                id: 22, chapter: 4, title: "ターゲットの憑依", 
                description: "特定のターゲットになりきってアイデアを評価する。",
                inputs: [
                    { id: "idea", label: "アイデア", placeholder: "アイデア..." },
                    { id: "persona", label: "憑依する人物", placeholder: "例：辛口な批評家" }
                ],
                template: "あなたは「{{persona}}」になりきってください。その視点から見ると、「{{idea}}」はどう映りますか？\n率直な感想、不満点、そして「こうすればもっと良くなる」というアドバイスを語ってください。"
            },
            {
                id: 23, chapter: 4, title: "比喩とメタファー", 
                description: "アイデアを別のものに例えて、本質を明確にする。",
                inputs: [{ id: "idea", label: "アイデア", placeholder: "アイデア..." }],
                template: "「{{idea}}」の特徴や価値を、全く別の分野（料理、スポーツ、自然現象など）に例えて説明してください（メタファー）。\nその例えを使うことで、このアイデアのどの本質的な価値が強調されますか？"
            },

            // 第5章 具体化
            {
                id: 24, chapter: 5, title: "アイデアスケッチ", 
                description: "1行のタイトルと3行の詳細で、アイデアの骨子を固める。",
                inputs: [{ id: "idea", label: "アイデアの種", type: "textarea", placeholder: "アイデア..." }],
                template: "このアイデアを「アイデアのタイトル（1行）」および「アイデアの詳細内容（3行）」という形式で記述してください。\n誰向けの、何で、狙いは何かがわかるようにしてください。\n方向性を大きく変えて3パターン書いてください。\n\nアイデアの種：{{idea}}"
            },
            {
                id: 25, chapter: 5, title: "6W3H", 
                description: "実行計画に必要な要素を網羅的に洗い出す。",
                inputs: [{ id: "idea", label: "具体化したいアイデア", placeholder: "アイデア..." }],
                template: "「{{idea}}」を実現するための計画を、6W3H（When, Where, Who, Whom, Why, What, How, How much, How many）のフレームワークですべて具体的に埋めてください。"
            },
            {
                id: 26, chapter: 5, title: "ステップ化", 
                description: "実現までのプロセスを細分化し、最初の一歩を明確にする。",
                inputs: [{ id: "goal", label: "実現したいゴール", placeholder: "例：アプリを1万DL達成" }],
                template: "「{{goal}}」を実現するためのロードマップを作成してください。\nプロセスを10段階のステップに分解し、特に最初のステップ（明日からできること）は具体的に記述してください。"
            },

            // 第6章 検証
            {
                id: 27, chapter: 6, title: "妥当性の検証", 
                description: "客観的な数値で評価し、独りよがりな熱狂を冷ます。",
                inputs: [{ id: "idea", label: "評価したいアイデア", type: "textarea", placeholder: "アイデア..." }],
                template: "以下のアイデアについて、その妥当性（実現可能性、市場性、収益性など）を1〜10点で評価してください（最高が10点）。\n点数の理由を辛口に解説し、スコアを上げるための改善案を提示してください。\n\nアイデア：{{idea}}"
            },
            {
                id: 28, chapter: 6, title: "強みの検証 (VRIO)", 
                description: "自社のリソースと合致しているか、模倣困難かを問う。",
                inputs: [
                    { id: "idea", label: "事業アイデア", placeholder: "アイデア..." },
                    { id: "resource", label: "自分の強み", placeholder: "例：デザインスキル" }
                ],
                template: "「{{idea}}」を行うにあたり、私の持つ「{{resource}}」は強みになりますか？\nVRIO分析（価値、希少性、模倣困難性、組織）の観点から分析し、競争優位性を築く戦略をアドバイスしてください。"
            },
            {
                id: 29, chapter: 6, title: "影響力の人", 
                description: "キーマンとなる人物やインフルエンサーの影響を考える。",
                inputs: [{ id: "idea", label: "アイデア", placeholder: "アイデア..." }],
                template: "「{{idea}}」が普及するために鍵となる人物（キーマン、インフルエンサー、ゲートキーパー）はどのような人ですか？\n彼らを味方につけるためのアプローチ方法を考えてください。"

                                            copyFeedback 
                                            ? 'bg-emerald-600 text-white shadow-[0_0_10px_rgba(5,150,105,0.4)]' 
                                            : 'bg-amber-500 hover:bg-amber-400 text-slate-900 hover:shadow-[0_0_10px_rgba(245,158,11,0.4)]'
                                        }`}
                                    >
                                        {copyFeedback ? <Check size={14} /> : <Copy size={14} />}
                                        {copyFeedback ? "Copied!" : "Copy to Clipboard"}
                                    </button>
                                </div>
                                <div className="relative">
                                    <pre className="text-xs text-slate-300 whitespace-pre-wrap font-mono leading-relaxed opacity-90 max-h-[300px] overflow-y-auto custom-scrollbar">
                                        {generatedPrompt}
                                    </pre>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* --- Main Content --- */}
                    <main className="flex-1 md:ml-[31.2rem] h-full flex flex-col overflow-hidden bg-slate-50">
                        
                        {/* Mobile Header */}
                        <div className="md:hidden bg-white border-b p-4 flex justify-between items-center shadow-sm z-20">
                            <h1 className="font-bold serif text-slate-800">思考の全技術</h1>
                            <button onClick={() => setIsSidebarOpen(true)} className="p-2 text-slate-600 hover:bg-slate-100 rounded-full cursor-pointer">
                                <Menu size={24} />
                            </button>
                        </div>

                        {/* Chapter Tabs */}
                        <div className="bg-white border-b border-slate-200 shadow-sm z-10">
                                <div className="px-4 py-2 bg-slate-100 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">
                                {currentSectionName.split(' ')[0]} <span className="text-slate-400 font-normal normal-case ml-2">{currentSectionName.split(' ').slice(1).join(' ')}</span>
                            </div>
                            <div className="w-full">
                                <div className="flex flex-wrap px-4 py-3 gap-2">
                                    {CHAPTERS.map(chapter => (
                                        <button
                                            key={chapter.id}
                                            onClick={() => setSelectedChapter(chapter.id)}
                                            className={`
                                                flex flex-col items-start px-4 py-2 rounded-lg text-sm transition-all duration-200 border cursor-pointer
                                                ${selectedChapter === chapter.id 
                                                    ? `${chapter.color} text-white border-transparent shadow-md transform scale-105` 
                                                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-slate-300'
                                                }
                                            `}
                                        >
                                            <span className={`text-[10px] opacity-80 uppercase tracking-wider ${selectedChapter === chapter.id ? 'text-white' : 'text-slate-400'}`}>Chapter {chapter.id}</span>
                                            <span className="font-bold font-serif">{chapter.title.replace(/^第\d章\s/, '')}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Technique Grid */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                            <div className="max-w-6xl mx-auto">
                                <div className="mb-6 flex items-end justify-between">
                                    <h2 className="text-xl md:text-2xl font-bold serif text-slate-800 flex items-center gap-3">
                                        <span className={`w-1.5 h-8 rounded-full ${CHAPTERS.find(c => c.id === selectedChapter).color}`}></span>
                                        {CHAPTERS.find(c => c.id === selectedChapter).title}
                                    </h2>
                                    <span className="text-xs text-slate-400 hidden sm:inline-block">
                                        {filteredTechniques.length} Techniques available
                                    </span>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                                    {filteredTechniques.map(tech => (
                                        <button
                                            key={tech.id}
                                            onClick={() => {
                                                setSelectedTechniqueId(tech.id);
                                                if (window.innerWidth < 768) setIsSidebarOpen(true);
                                            }}
                                            className={`
                                                group relative text-left p-5 rounded-xl border transition-all duration-200 hover:shadow-lg hover:-translate-y-1 cursor-pointer
                                                ${selectedTechniqueId === tech.id 
                                                    ? 'bg-white border-amber-400 ring-1 ring-amber-400 shadow-md' 
                                                    : 'bg-white border-slate-200 hover:border-amber-300'
                                                }
                                            `}
                                        >
                                            <div className="flex justify-between items-start mb-3">
                                                <span className={`
                                                    inline-flex items-center justify-center w-7 h-7 rounded-md text-xs font-bold font-mono
                                                    ${selectedTechniqueId === tech.id 
                                                        ? 'bg-amber-100 text-amber-700' 
                                                        : 'bg-slate-100 text-slate-500 group-hover:bg-amber-50 group-hover:text-amber-600'
                                                    }
                                                `}>
                                                    {tech.id}
                                                </span>
                                                {selectedTechniqueId === tech.id && (
                                                    <CheckCircle className="text-amber-500" size={18} />
                                                )}
                                            </div>
                                            <h3 className={`font-bold text-base mb-2 group-hover:text-amber-700 transition-colors ${selectedTechniqueId === tech.id ? 'text-slate-900' : 'text-slate-700'}`}>
                                                {tech.title}
                                            </h3>
                                            <p className="text-xs text-slate-500 leading-relaxed line-clamp-3">
                                                {tech.description}
                                            </p>
                                        </button>
                                    ))}
                                    
                                    {/* Empty State */}
                                    {filteredTechniques.length === 0 && (
                                        <div className="col-span-full py-16 text-center border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50">
                                            <div className="inline-block p-4 rounded-full bg-slate-100 text-slate-400 mb-3">
                                                <BookOpen size={32} />
                                            </div>
                                            <p className="text-slate-500 font-medium">この章の技法は準備中です。</p>
                                            <p className="text-xs text-slate-400 mt-1">Coming soon...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
