        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f1f5f9;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
            gap: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>

                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast(successMsg);
                    return true;

                    return false;
                } finally {
                    document.body.removeChild(textArea);

                        item.char.includes(query)

                    return { ...group, items: filteredItems };

                                        ))
                                    ) : (
                                        <div className="h-full flex flex-col items-center justify-center text-slate-400">
                                            <IconSearch size={48} className="opacity-10 mb-2" />
                                            <p className="text-sm">お探しの絵文字は見つかりませんでした</p>
                                            <button
                                                onClick={() => setSearchQuery("")}
                                                className="text-xs text-blue-500 mt-2 hover:underline"
                                            >
                                                すべての絵文字を表示
                                            </button>
                                        </div>
                                    )}
                                </div>
                                <p className="text-[10px] text-slate-400 mt-2 text-center italic">※ 絵文字をクリックするとその文字自体をコピーします</p>
                            </div>

                            {/* Result Area */}
                            <div className="space-y-4 pt-6 border-t border-slate-100">
                                <div className="flex items-center justify-between">
                                    <span className="text-sm font-semibold text-slate-700">HTML Snippet</span>
                                    <button
                                        onClick={copyCodeSnippet}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${copied
                                                ? 'bg-green-100 text-green-700'
                                                : 'bg-slate-800 text-white hover:bg-slate-700 active:scale-95 shadow-lg'
                                            }`}
                                    >
                                        {copied ? <IconCheck size={16} /> : <IconCopy size={16} />}
                                        {copied ? 'コピー完了' : 'コードをコピー'}
                                    </button>
                                </div>

                                <div className="relative group">
                                    <pre className="p-4 bg-slate-900 rounded-xl text-blue-300 text-xs font-mono overflow-x-auto whitespace-pre-wrap leading-relaxed border border-slate-800 shadow-inner">
                                        {snippet}
                                    </pre>
                                </div>

                                <div className="p-4 bg-blue-50 rounded-xl border border-blue-100 flex items-center gap-4">
                                    <div className="text-4xl p-2 bg-white rounded-lg shadow-sm border border-blue-100 select-none">
                                        {selectedEmoji}
                                    </div>
                                    <div className="text-xs text-blue-700 leading-relaxed">
                                        <span className="font-bold block mb-1">使い方:</span>
                                        上のコードを <code>&lt;head&gt;</code> 内に貼り付けてください。
                                        外部ファイルなしで、ブラウザのタブにこの絵文字が表示されます。
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
