<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systemd User Service Configuration</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
        
        /* Command list slide-in effect */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 selection:bg-blue-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('generator');
            const [serviceName, setServiceName] = useState('my-app');
            const [description, setDescription] = useState('My Custom User Service');
            const [execStart, setExecStart] = useState('/usr/bin/python3 /path/to/script.py');
            const [workingDir, setWorkingDir] = useState('');
            const [isLinger, setIsLinger] = useState(true); 
            const [userName, setUserName] = useState('');
            const [envVars, setEnvVars] = useState([{ key: '', value: '' }]);
            const [defaultEnvs, setDefaultEnvs] = useState([{ key: '', value: '' }]);
            const [copied, setCopied] = useState(null);

            const addEnvVar = () => setEnvVars([...envVars, { key: '', value: '' }]);
            const removeEnvVar = (index) => setEnvVars(envVars.filter((_, i) => i !== index));
            const updateEnvVar = (index, field, value) => {
                const newVars = [...envVars];
                newVars[index][field] = value;
                setEnvVars(newVars);
            };

            const addDefaultEnv = () => setDefaultEnvs([...defaultEnvs, { key: '', value: '' }]);
            const removeDefaultEnv = (index) => setDefaultEnvs(defaultEnvs.filter((_, i) => i !== index));
            const updateDefaultEnv = (index, field, value) => {
                const newVars = [...defaultEnvs];
                newVars[index][field] = value;
                setDefaultEnvs(newVars);
            };

            const copyToClipboard = (text, id) => {
                const el = document.createElement('textarea');
                el.value = text;
                el.setAttribute('readonly', '');
                el.style.position = 'absolute';
                el.style.left = '-9999px';
                document.body.appendChild(el);
                el.select();
                try {
                    document.execCommand('copy');
                    setCopied(id);
                    setTimeout(() => setCopied(null), 2000);
                } catch (err) {
                    console.error('Failed to copy', err);
                }
                document.body.removeChild(el);
            };

            const downloadFile = (filename, content) => {
                const element = document.createElement('a');
                const file = new Blob([content], {type: 'text/plain'});
                element.href = URL.createObjectURL(file);
                element.download = filename;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            };

            const commands = useMemo(() => {
                const list = [
                    { label: 'ディレクトリ作成', cmd: 'mkdir -p ~/.config/systemd/user/' },
                    { label: '設定の再読み込み', cmd: 'systemctl --user daemon-reload' },
                    { label: '自動起動の有効化', cmd: `systemctl --user enable ${serviceName}.service` },
                    { label: 'サービスの開始', cmd: `systemctl --user start ${serviceName}.service` },
                    { label: 'ステータス確認', cmd: `systemctl --user status ${serviceName}.service` },
                    { label: 'ログの確認 (リアルタイム)', cmd: `journalctl --user -u ${serviceName}.service -f` },
                ];
                if (isLinger) {
                    list.unshift({ 
                        label: 'ログオフ後の実行許可 (Linger)', 
                        cmd: `loginctl enable-linger ${userName || '$USER'}` 
                    });
                }
                return list;
            }, [serviceName, isLinger, userName]);

            const serviceFileContent = useMemo(() => {
                const envStrings = envVars
                    .filter(ev => ev.key && ev.value)
                    .map(ev => `Environment="${ev.key}=${ev.value}"`)
                    .join('\n');

                const commandComments = commands
                    .map(c => `# ${c.label}: ${c.cmd}`)
                    .join('\n');

                return `# Management Commands:
${commandComments}

[Unit]
Description=${description}
After=network.target

[Service]
ExecStart=${execStart}
${workingDir ? `WorkingDirectory=${workingDir}` : '# WorkingDirectory='}
Restart=always
${envStrings}

[Install]
WantedBy=default.target`;
            }, [description, execStart, workingDir, envVars, commands]);

            const userConfContent = useMemo(() => {
                const defaultEnvStrings = defaultEnvs
                    .filter(ev => ev.key && ev.value)
                    .map(ev => `${ev.key}=${ev.value}`)
                    .join(' ');

                return `[Manager]
${defaultEnvStrings ? `DefaultEnvironment=${defaultEnvStrings}` : '# DefaultEnvironment='}`;
            }, [defaultEnvs]);

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-20">
                        <div className="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 p-1.5 rounded shadow-sm text-lg">
                                    📟
                                </div>
                                <h1 className="text-xl font-bold tracking-tight text-gray-800 uppercase">Systemd User Service Configuration</h1>
                            </div>
                            <a 
                                href="https://wiki.archlinux.jp/index.php/Systemd/%E3%83%A6%E3%83%BC%E3%82%B6%E3%83%BC" 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="text-xs text-blue-600 hover:underline flex items-center gap-1 bg-blue-50 px-3 py-1.5 rounded-full font-medium"
                            >
                                Arch Wiki 🔗
                            </a>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto p-6 space-y-10 mt-4">
                        {/* 1. Basic Settings & Linger */}
                        <section className="bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
                            <h2 className="text-xl font-bold mb-6 flex items-center gap-3">
                                <span className="bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center text-sm shadow-md font-mono">1</span>
                                基本設定 & 永続化
                            </h2>
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1.5">サービス名</label>
                                        <input 
                                            type="text" 
                                            value={serviceName} 
                                            onChange={(e) => setServiceName(e.target.value)}
                                            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50/50 transition-all"
                                            placeholder="my-service"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1.5">説明文</label>
                                        <input 
                                            type="text" 
                                            value={description} 
                                            onChange={(e) => setDescription(e.target.value)}
                                            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50/50 transition-all"
                                            placeholder="My Custom User Service"
                                        />
                                    </div>
                                </div>

                                <div className="space-y-4 pt-2">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1.5 flex items-center gap-2">
                                            💻 実行コマンド (ExecStart)
                                        </label>
                                        <input 
                                            type="text" 
                                            value={execStart} 
                                            onChange={(e) => setExecStart(e.target.value)}
                                            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-mono text-sm bg-gray-50 transition-all"
                                            placeholder="/usr/bin/python3 /path/to/script.py"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1.5 flex items-center gap-2">
                                            📁 作業ディレクトリ (WorkingDirectory)
                                        </label>
                                        <input 
                                            type="text" 
                                            value={workingDir} 
                                            onChange={(e) => setWorkingDir(e.target.value)}
                                            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-mono text-sm bg-gray-50 transition-all"
                                            placeholder="/home/user/projects/app"
                                        />
                                    </div>
                                </div>

                                <div className="mt-8 p-6 bg-blue-50/50 border border-blue-100 rounded-xl space-y-4">
                                    <div className="flex items-start gap-4">
                                        <div className="bg-blue-100 p-2 rounded-lg text-xl">
                                            🛡️
                                        </div>
                                        <div>
                                            <label className="flex items-center gap-3 cursor-pointer group">
                                                <input 
                                                    type="checkbox" 
                                                    checked={isLinger} 
                                                    onChange={(e) => setIsLinger(e.target.checked)}
                                                    className="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500 transition-all"
                                                />
                                                <span className="text-base font-bold text-blue-900 group-hover:text-blue-700 transition-colors">
                                                    ログオフしていても動作させる (Linger)
                                                </span>
                                            </label>
                                            <p className="mt-2 text-sm text-blue-700 leading-relaxed">
                                                有効にすると、ユーザーがログインしていなくてもシステム起動時に自動的にユーザーセッションが開始され、サービスが起動します。
                                                <span className="block mt-1 font-bold">※この設定は一度実行すれば、OS再起動後も永続的に維持されます。</span>
                                            </p>
                                        </div>
                                    </div>
                                    {isLinger && (
                                        <div className="ml-12 pt-2">
                                            <label className="block text-xs font-bold text-blue-800 uppercase mb-1.5 tracking-wider">対象ユーザー名 (空欄の場合は $USER)</label>
                                            <input 
                                                type="text" 
                                                value={userName} 
                                                onChange={(e) => setUserName(e.target.value)}
                                                className="w-full px-4 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white shadow-sm transition-all"
                                                placeholder="username"
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>
                        </section>

                        {/* 2. Environment Variables */}
                        <section className="bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
                            <h2 className="text-xl font-bold mb-6 flex items-center gap-3">
                                <span className="bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center text-sm shadow-md font-mono">2</span>
                                環境変数設定 (サービス用)
                            </h2>
                            <div className="space-y-4">
                                <div className="flex justify-between items-center mb-2">
                                    <p className="text-sm text-gray-500">このサービス内でのみ有効な変数を設定します。</p>
                                    <button onClick={addEnvVar} className="text-xs font-bold text-blue-600 hover:bg-blue-50 px-3 py-1.5 rounded-lg flex items-center gap-1.5 border border-blue-200 transition-all active:scale-95">
                                        ➕ 変数を追加
                                    </button>
                                </div>
                                <div className="space-y-3">
                                    {envVars.map((ev, i) => (
                                        <div key={i} className="flex gap-3 group">
                                            <input 
                                                placeholder="KEY (例: PATH)" 
                                                value={ev.key} 
                                                onChange={(e) => updateEnvVar(i, 'key', e.target.value)}
                                                className="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50/30 focus:ring-1 focus:ring-blue-500 focus:outline-none transition-all"
                                            />
                                            <input 
                                                placeholder="VALUE" 
                                                value={ev.value} 
                                                onChange={(e) => updateEnvVar(i, 'value', e.target.value)}
                                                className="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50/30 focus:ring-1 focus:ring-blue-500 focus:outline-none transition-all"
                                            />
                                            <button onClick={() => removeEnvVar(i)} className="p-2 text-gray-400 hover:text-red-500 transition-colors" title="削除">
                                                🗑️
                                            </button>
                                        </div>
                                    ))}
                                    {envVars.length === 0 && (
                                        <div className="text-center py-6 border border-dashed border-gray-200 rounded-lg text-gray-400 text-sm">環境変数は設定されていません</div>
                                    )}
                                </div>
                            </div>
                        </section>

                        {/* 3. Global Config */}
                        <section className="bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
                            <h2 className="text-xl font-bold mb-6 flex items-center gap-3">
                                <span className="bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center text-sm shadow-md font-mono">3</span>
                                マネージャー全体の既定値 (user.conf)
                            </h2>
                            <div className="space-y-4">
                                <div className="flex justify-between items-center mb-2">
                                    <p className="text-sm text-gray-500">全てのユーザーサービスに適用される既定の環境変数を定義します。</p>
                                    <button onClick={addDefaultEnv} className="text-xs font-bold text-blue-600 hover:bg-blue-50 px-3 py-1.5 rounded-lg flex items-center gap-1.5 border border-blue-200 transition-all active:scale-95">
                                        ➕ 変数を追加
                                    </button>
                                </div>
                                <div className="space-y-3">
                                    {defaultEnvs.map((ev, i) => (
                                        <div key={i} className="flex gap-3 group">
                                            <input placeholder="KEY" value={ev.key} onChange={(e) => updateDefaultEnv(i, 'key', e.target.value)} className="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50/30 focus:ring-1 focus:ring-blue-500 focus:outline-none transition-all" />
                                            <input placeholder="VALUE" value={ev.value} onChange={(e) => updateDefaultEnv(i, 'value', e.target.value)} className="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50/30 focus:ring-1 focus:ring-blue-500 focus:outline-none transition-all" />
                                            <button onClick={() => removeDefaultEnv(i)} className="p-2 text-gray-400 hover:text-red-500 transition-colors">🗑️</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* 4. Download Panel */}
                        <section className="bg-white p-8 rounded-xl border border-gray-200 shadow-xl ring-4 ring-blue-50">
                            <h2 className="text-xl font-bold mb-6 flex items-center gap-3">
                                <span className="bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center text-sm shadow-md font-mono">4</span>
                                ファイル確認 & ダウンロード
                            </h2>
                            <div className="border border-gray-200 rounded-xl overflow-hidden shadow-inner">
                                <div className="flex bg-gray-50 border-b border-gray-200 font-bold">
                                    <button onClick={() => setActiveTab('generator')} className={`flex-1 py-4 px-6 text-sm transition-all border-r border-gray-200 ${activeTab === 'generator' ? 'bg-white text-blue-600 border-t-2 border-t-blue-600' : 'text-gray-500 hover:bg-gray-100'}`}>
                                        <div className="flex items-center justify-center gap-2">📄 {serviceName}.service</div>
                                    </button>
                                    <button onClick={() => setActiveTab('userconf')} className={`flex-1 py-4 px-6 text-sm transition-all ${activeTab === 'userconf' ? 'bg-white text-blue-600 border-t-2 border-t-blue-600' : 'text-gray-500 hover:bg-gray-100'}`}>
                                        <div className="flex items-center justify-center gap-2">⚙️ user.conf</div>
                                    </button>
                                </div>
                                <div className="p-6">
                                    <div className="relative group">
                                        <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity z-10">
                                            <button onClick={() => copyToClipboard(activeTab === 'generator' ? serviceFileContent : userConfContent, 'file-pre')} className="p-2 bg-white border border-gray-200 rounded-lg shadow-sm hover:bg-gray-50 text-gray-600 flex items-center justify-center text-sm" title="コピー">
                                                {copied === 'file-pre' ? '✅' : '📋'}
                                            </button>
                                        </div>
                                        <div className="bg-gray-900 rounded-xl p-6 font-mono text-sm text-blue-100 whitespace-pre overflow-x-auto min-h-[250px] leading-relaxed shadow-lg border border-gray-800">
                                            {activeTab === 'generator' ? serviceFileContent : userConfContent}
                                        </div>
                                    </div>
                                    <div className="mt-8 flex flex-col sm:flex-row gap-4">
                                        <button onClick={() => downloadFile(activeTab === 'generator' ? `${serviceName}.service` : 'user.conf', activeTab === 'generator' ? serviceFileContent : userConfContent)} className="flex-1 flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95">
                                            📥 ファイルをダウンロード
                                        </button>
                                        <button onClick={() => copyToClipboard(activeTab === 'generator' ? serviceFileContent : userConfContent, 'file')} className="px-8 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2">
                                            {copied === 'file' ? <span className="text-green-600 font-bold">✅</span> : <span>📋 コピー</span>}
                                        </button>
                                    </div>
                                    <div className="mt-5 flex items-center justify-center gap-2 text-xs text-gray-400 bg-gray-50 py-3 rounded-lg border border-gray-100">
                                        ℹ️ 保存先: <code className="bg-gray-200 px-1.5 py-0.5 rounded text-gray-600">{activeTab === 'generator' ? `~/.config/systemd/user/${serviceName}.service` : `~/.config/systemd/user.conf`}</code>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* 5. Command Execution */}
                        <section className="bg-gray-800 text-gray-200 p-8 rounded-xl shadow-2xl border border-gray-700">
                            <h2 className="text-xl font-bold mb-6 flex items-center gap-3 text-white">
                                <span className="bg-white text-gray-900 w-8 h-8 rounded-lg flex items-center justify-center text-sm font-black font-mono">5</span>
                                実行コマンド
                            </h2>
                            <div className="space-y-6">
                                <div className="text-sm text-gray-400 leading-relaxed border-l-2 border-blue-500 pl-4 space-y-2">
                                    <p>ファイルを保存した後、以下のコマンドを上から順にターミナルで実行してください。</p>
                                    <p className="text-blue-300 font-medium">⚠️ 注意: パス指定（WorkingDirectoryやExecStart）には必ず<strong>フルパス</strong>を使用し、実行前にディレクトリが存在することを確認してください。</p>
                                </div>
                                <div className="space-y-4">
                                    {commands.map((c, i) => (
                                        <div key={i} className="animate-slide-in" style={{ animationDelay: `${i * 80}ms` }}>
                                            <div className="text-[10px] text-gray-500 font-black uppercase tracking-widest mb-1.5 ml-1">{c.label}</div>
                                            <div className="flex items-center justify-between bg-black/40 p-4 rounded-xl border border-white/5 font-mono text-xs hover:border-blue-500/20 transition-all shadow-inner group">
                                                <span className="text-blue-500 mr-2 shrink-0 select-none">$</span>
                                                <span className="truncate flex-1 text-gray-300">{c.cmd}</span>
                                                <button onClick={() => copyToClipboard(c.cmd, `cmd-${i}`)} className="ml-4 p-2.5 bg-gray-700/50 rounded-lg hover:bg-gray-600 text-white transition-all active:scale-90 flex items-center justify-center">
                                                    {copied === `cmd-${i}` ? <span className="text-green-400">✅</span> : <span className="opacity-70 group-hover:opacity-100">📋</span>}
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        <div className="bg-amber-50 border border-amber-200 p-6 rounded-xl text-amber-900 text-sm leading-relaxed shadow-sm flex gap-4">
                            <span className="text-2xl mt-1">ℹ️</span>
                            <div>
                                <h4 className="font-black uppercase tracking-tighter mb-1.5 text-amber-800">重要事項</h4>
                                <ul className="list-disc ml-5 space-y-1">
                                    <li><code>WorkingDirectory=</code> や <code>ExecStart=</code> に記述するパスには必ず<strong>フルパス</strong>で指定してください。</li>
                                    <li><code>enable-linger</code> は<strong>一度実行するだけで大丈夫です。</strong>OSを再起動しても設定は永続的に維持されます。</li>
                                </ul>
                            </div>
                        </div>
                    </main>

                    <footer className="max-w-3xl mx-auto px-6 py-12 text-center text-gray-400 text-xs">
                        <p className="font-medium tracking-wide italic">Systemd User Service Configuration Tool - Optimized for Arch Linux</p>
                        <p className="mt-2 opacity-50">© 2024</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
