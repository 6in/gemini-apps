                if (drawingType === 'counter') {
                    // 連番の場合はドラッグ完了処理なし
                    return;
                }

                if (isDragging && activeShape) {
                    isDragging = false;
                    if (activeShape.width === 0 && activeShape.scaleX === 0) {
                        canvas.remove(activeShape);
                    } else if (drawingType === 'trim') {
                        performTrimCopy(activeShape);
                        canvas.remove(activeShape);
                        setMode('select');
                    } else if (drawingType === 'text') {
                        const left = activeShape.left;
                        const top = activeShape.top;
                        canvas.remove(activeShape);
                        // デフォルト文字色を赤(#ef4444)に変更
                        const text = new fabric.IText('テキスト', { left: left, top: top, fontFamily: 'Noto Sans JP', fill: '#ef4444', fontSize: 40 });
                        canvas.add(text);
                        canvas.requestRenderAll();

                        // ★修正: テキスト追加時も履歴を保存
                        saveHistory();
                    } else {
                        activeShape.setCoords();
                        activeShape.set({ selectable: true, evented: true });
                        if (activeShape.customType === 'arrow') updateArrowControls(activeShape);
                        canvas.setActiveObject(activeShape);

                        // ★修正: 描画が完了したタイミングで履歴を保存
                        saveHistory();

                        canvas.requestRenderAll();
                    }
                    activeShape = null;
                }
                startPoint = null;
            }
        });

        // ---------------------------------------------------------
        // 矢印カスタムコントロール
        // ---------------------------------------------------------
        function updateArrowControls(arrow) {
            arrow.setControlsVisibility({ tl: false, tr: false, br: false, bl: false, ml: false, mt: false, mr: false, mb: false, mtr: false });
            arrow.controls.p2 = new fabric.Control({ x: 0.5, y: 0, cursorStyle: 'crosshair', actionHandler: anchorWrapper((e, t, x, y) => { changeArrowVector(t.target, x, y, 'head'); return true; }), render: renderCircleControl });
            arrow.controls.p1 = new fabric.Control({ x: -0.5, y: 0, cursorStyle: 'crosshair', actionHandler: anchorWrapper((e, t, x, y) => { changeArrowVector(t.target, x, y, 'tail'); return true; }), render: renderCircleControl });
        }
        function changeArrowVector(target, x, y, mode) {
            let startX = target.left; let startY = target.top;
            const rad = fabric.util.degreesToRadians(target.angle);
            const len = target.width * target.scaleX;
            let endX = startX + Math.cos(rad) * len; let endY = startY + Math.sin(rad) * len;
            if (mode === 'head') { endX = x; endY = y; } else { startX = x; startY = y; }
            const dx = endX - startX; const dy = endY - startY;
            const newAngle = fabric.util.radiansToDegrees(Math.atan2(dy, dx));
            const newLen = Math.sqrt(dx * dx + dy * dy);
            if (newLen < 10) return;
            target.set({ left: startX, top: startY, angle: newAngle, scaleX: newLen / target.width });
            target.setCoords();
        }
        function anchorWrapper(fn) { return function (eventData, transform, x, y) { return fn(eventData, transform, x, y); } }
        function renderCircleControl(ctx, left, top, styleOverride, fabricObject) {
            ctx.save(); ctx.translate(left, top); ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
        }
        function getArrowPath(type) {
            return type === 'double' ? 'M 10 10 L 30 30 L 30 15 L 70 15 L 70 30 L 90 10 L 70 -10 L 70 5 L 30 5 L 30 -10 Z' : 'M 0 5 L 70 5 L 70 15 L 100 0 L 70 -15 L 70 -5 L 0 -5 Z';
        }

        // ---------------------------------------------------------
        // 画像アップロード & ペースト (タブ連携)
        // ---------------------------------------------------------
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            // アップロード時も新規タブ設定を見るか？
            // ファイル選択は意図的なので、ここでは現在のタブ上書き or 名前変更という挙動を維持しつつ、
            // もし画像がまだない空のタブなら名前を変える、などが自然。
            // 今回はペースト時の要望なので、アップロードボタンの挙動は維持します。

            const currentTab = tabs.find(t => t.id === currentTabId);
            if (currentTab) {
                currentTab.title = file.name;
                renderTabs();
            }

            const reader = new FileReader();
            reader.onload = function (f) {
                const data = f.target.result;
                fabric.Image.fromURL(data, function (img) {
                    processImagePlacement(img, true);
                    e.target.value = '';
                });
            };
            reader.readAsDataURL(file);
        }

        window.addEventListener('paste', function (e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const autoResize = document.getElementById('auto-resize-paste').checked;
            const openInNewTab = document.getElementById('paste-new-tab').checked; // 設定取得

            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const file = items[i].getAsFile();
                    const reader = new FileReader();

                    reader.onload = function (event) {
                        // 新規タブで開く設定がONなら、まずタブを作成して切り替える
                        if (openInNewTab) {
                            // タイトル指定なし(=現在時刻)で作成
                            createNewTab(null);
                        }

                        fabric.Image.fromURL(event.target.result, function (img) {
                            processImagePlacement(img, autoResize);
                        });
                    };
                    reader.readAsDataURL(file);
                    e.preventDefault();
                    return;
                }
            }
        });

        function processImagePlacement(img, autoResize) {
            const currentTab = tabs.find(t => t.id === currentTabId);
            if (!currentTab) return;

            // hasMainImage は currentTab のプロパティとして管理
            // 新規タブ作成直後は hasMainImage = false なので、
            // autoResize=true と組み合わせると「新規タブ＋サイズ合わせ」で綺麗に配置される
            if (autoResize && !currentTab.hasMainImage) {
                const padding = 10;
                const newWidth = img.width + padding;
                const newHeight = img.height + padding;

                currentTab.baseDimensions.width = newWidth;
                currentTab.baseDimensions.height = newHeight;
                currentTab.zoom = 1;
                currentTab.hasMainImage = true;

                canvas.setZoom(1);
                canvas.setWidth(newWidth);
                canvas.setHeight(newHeight);
                updateInfoDisplay(currentTab);

                img.set({ left: padding / 2, top: padding / 2, selectable: false, evented: false, hoverCursor: 'default' });
                canvas.add(img);
                canvas.sendToBack(img);
            } else {
                const targetWidth = (currentTab.baseDimensions.width * 0.5);
                if (img.width > targetWidth) img.scaleToWidth(targetWidth);
                img.set({
                    left: currentTab.baseDimensions.width / 2 - (img.getScaledWidth() / 2),
                    top: currentTab.baseDimensions.height / 2 - (img.getScaledHeight() / 2),
                    selectable: true, evented: true
                });
                canvas.add(img);
                canvas.setActiveObject(img);
            }
            canvas.requestRenderAll();
        }

        function updateZoom(value) {
            const percentage = parseInt(value, 10);
            const zoomRatio = percentage / 100;

            const currentTab = tabs.find(t => t.id === currentTabId);
            if (currentTab) {
                currentTab.zoom = zoomRatio;
                canvas.setZoom(zoomRatio);
                canvas.setWidth(currentTab.baseDimensions.width * zoomRatio);
                canvas.setHeight(currentTab.baseDimensions.height * zoomRatio);
                updateInfoDisplay(currentTab);
            }
        }

        function updateCanvasColor(color) {
            const currentTab = tabs.find(t => t.id === currentTabId);
            if (currentTab) currentTab.backgroundColor = color;
            canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
        }

        function performTrimCopy(selectionRect) {
            // 1. 枠線が画像に写り込まないように一時的に非表示にする
            selectionRect.visible = false;
            canvas.renderAll();

            try {
                // 2. 切り取り範囲の座標を取得
                // Fabric.jsのオブジェクト座標は「論理座標（Zoom=1の状態）」なので、
                // そのまま使用することで正確な位置を取得できます。
                const left = selectionRect.left;
                const top = selectionRect.top;
                const width = selectionRect.getScaledWidth();
                const height = selectionRect.getScaledHeight();

                // 3. 画像データを生成
                const dataURL = canvas.toDataURL({
                    left: left,
                    top: top,
                    width: width,
                    height: height,
                    format: 'png',
                    multiplier: 1 // 解像度を上げたい場合はここを2などに変更
                });

                // 4. クリップボードへ書き込み
                fetch(dataURL).then(res => res.blob()).then(blob => {
                    if (!navigator.clipboard || !navigator.clipboard.write) {
                        showAlert('エラー: この環境ではクリップボード操作が許可されていません。\n(HTTPSまたはlocalhostでのアクセスが必要です)', "エラー", true);
                        return;
                    }
                    const item = new ClipboardItem({ "image/png": blob });
                    navigator.clipboard.write([item])
                        .then(() => showToast('選択範囲をコピーしました！')) // ★変更: トースト表示
                        .catch(err => showAlert('コピー失敗: ' + err.message, "エラー", true));
                }).catch(err => showAlert('処理失敗: ' + err.message, "エラー", true));

            } catch (e) {
                console.error(e);
                showAlert('エラーが発生しました: ' + e.message, "エラー", true);
            } finally {
                // 処理完了後の後始末（呼び出し元でremoveされるので画面上は消えます）
                canvas.requestRenderAll();
            }
        }

        function copyToClipboard() {
            canvas.discardActiveObject();
            canvas.renderAll();

            document.getElementById('c').toBlob(function (blob) {
                if (!blob) return showAlert('画像の生成に失敗しました', "エラー", true);

                // APIの存在チェック
                if (!navigator.clipboard || !navigator.clipboard.write) {
                    showAlert('エラー: クリップボードAPIが使用できません。\n\n考えられる原因:\n1. URLがIPアドレスになっている (http://192.168...)\n2. HTTPS通信ではない\n3. ブラウザが対応していない', "エラー", true);
                    return;
                }

                try {
                    const item = new ClipboardItem({ "image/png": blob });
                    navigator.clipboard.write([item]).then(() => {
                        showToast('画像をコピーしました！'); // ★変更: トースト表示
                    }).catch(err => {
                        console.error('Clipboard Write Error:', err);
                        // 具体的なエラー内容を表示
                        showAlert('コピーに失敗しました:\n' + err.name + ': ' + err.message, "エラー", true);
                    });
                } catch (err) {
                    console.error('Clipboard Item Error:', err);
                    // 具体的なエラー内容を表示
                    showAlert('処理を開始できませんでした:\n' + err.name + ': ' + err.message, "エラー", true);
                }
            });
        }

        function downloadImage() {
            canvas.discardActiveObject(); canvas.renderAll();
            const dataURL = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 1 / canvas.getZoom() });
            const link = document.createElement('a'); link.download = 'edited-image.png'; link.href = dataURL;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function clearCanvas() {
            const performClear = () => {
                canvas.clear();
                canvas.setBackgroundColor(null, canvas.renderAll.bind(canvas));

                const currentTab = tabs.find(t => t.id === currentTabId);
                if (currentTab) {
                    currentTab.baseDimensions = { width: 800, height: 600 };
                    currentTab.zoom = 1;
                    currentTab.hasMainImage = false;
                    currentTab.backgroundColor = null;

                    // カウンタもリセット
                    currentTab.counterValue = 1;
                    counterValue = 1;

                    canvas.setZoom(1);
                    canvas.setWidth(800);
                    canvas.setHeight(600);
                    document.getElementById('zoom-slider').value = 100;
                    updateInfoDisplay(currentTab);
                }

                setMode('select');
                updateUI();
                closeConfirmModal();
            };

            showConfirmModal('キャンバスをすべて消去しますか？\n（連番カウンタもリセットされます）', performClear);
        }

        function createColorPalette(containerId, onClickFn) {
            const container = document.getElementById(containerId); container.innerHTML = '';
            const colorPresets = ['#000000', '#ffffff', '#ef4444', '#3b82f6', '#22c55e', '#eab308', '#f97316', '#a855f7'];
            colorPresets.forEach(color => {
                const btn = document.createElement('button'); btn.className = 'w-6 h-6 rounded-full border border-gray-300 shadow-sm transition-transform hover:scale-110 color-btn';
                btn.style.backgroundColor = color;
                btn.onclick = () => { container.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); onClickFn(color); };
                container.appendChild(btn);
            });
        }
        createColorPalette('bg-palette', (c) => updateCanvasColor(c));
        createColorPalette('fill-palette', (c) => updateActiveObject('fill', c));
        createColorPalette('stroke-palette', (c) => updateActiveObject('stroke', c));
        createColorPalette('text-bg-palette', (c) => updateActiveObject('backgroundColor', c));

        const canvasSettingsEl = document.getElementById('canvas-settings');
        const selectionControlsEl = document.getElementById('selection-controls');
        const propTitleEl = document.getElementById('prop-title');
        const opacityInput = document.getElementById('opacity');
        const opacityValEl = document.getElementById('opacity-val');
        const strokeWidthInput = document.getElementById('stroke-width');
        const strokeWidthValEl = document.getElementById('stroke-width-val');

        canvas.on('selection:created', updateUI);
        canvas.on('selection:updated', updateUI);
        canvas.on('selection:cleared', updateUI);

        function updateUI() {
            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                canvasSettingsEl.classList.add('hidden'); selectionControlsEl.classList.remove('hidden'); propTitleEl.innerText = 'Object Properties';
                if (activeObj.customType === 'arrow') updateArrowControls(activeObj);

                let fill = activeObj.get('fill');
                // Group(連番)の場合、最初の要素(Circle)の色を取得
                if (activeObj.type === 'group' && activeObj.customType === 'counter') {
                    fill = activeObj.item(0).get('fill');
                }

                let stroke = activeObj.get('stroke'); let strokeWidth = activeObj.get('strokeWidth') || 0; let opacity = activeObj.get('opacity'); let bgColor = activeObj.get('backgroundColor');
                if (activeObj.customType === 'arrow') strokeWidth = Math.round(activeObj.scaleY * 10);
                if (activeObj.type !== 'path') { lastProps.fill = fill; lastProps.stroke = stroke; lastProps.strokeWidth = strokeWidth; lastProps.opacity = opacity; } else { lastArrowProps.fill = fill; }
                highlightPalette('fill-palette', fill); highlightPalette('stroke-palette', stroke); highlightPalette('text-bg-palette', bgColor);
                strokeWidthInput.value = strokeWidth; strokeWidthValEl.textContent = strokeWidth + 'px';
                opacityInput.value = opacity; opacityValEl.textContent = Math.round(opacity * 100) + '%';
                const textControls = document.getElementById('text-controls');
                if (activeObj.type === 'i-text' || activeObj.type === 'text') textControls.classList.remove('hidden'); else textControls.classList.add('hidden');
            } else {
                canvasSettingsEl.classList.remove('hidden'); selectionControlsEl.classList.add('hidden'); propTitleEl.innerText = 'Canvas Settings';
            }
        }

        function highlightPalette(paletteId, color) {
            const container = document.getElementById(paletteId);
            container.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
                if (color && typeof color === 'string' && convertToHex(btn.style.backgroundColor) === convertToHex(color)) btn.classList.add('active');
            });
        }
        function convertToHex(rgb) { if (!rgb) return ''; if (rgb.startsWith('#')) return rgb.toLowerCase(); const rgbMatch = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/); if (!rgbMatch) return rgb; function hex(x) { return ("0" + parseInt(x).toString(16)).slice(-2); } return "#" + hex(rgbMatch[1]) + hex(rgbMatch[2]) + hex(rgbMatch[3]); }

        function updateActiveObject(prop, value) {
            const activeObj = canvas.getActiveObject(); if (!activeObj) return;
            if (prop === 'opacity') { value = parseFloat(value); opacityValEl.textContent = Math.round(value * 100) + '%'; }
            if (prop === 'strokeWidth') {
                value = parseInt(value, 10); strokeWidthValEl.textContent = value + 'px';
                if (activeObj.customType === 'arrow') { const newScaleY = value / 10; activeObj.set('scaleY', Math.max(0.1, newScaleY)); canvas.requestRenderAll(); return; }
            }

            // 連番(Group)の特別処理
            if (activeObj.customType === 'counter') {
                if (prop === 'fill') {
                    // 背景の円の色を変更
                    activeObj.item(0).set('fill', value);
                    lastProps.fill = value;
                    highlightPalette('fill-palette', value);
                } else if (prop === 'opacity') {
                    activeObj.set('opacity', value);
                    lastProps.opacity = value;
                }
                canvas.requestRenderAll();
                return;
            }

            activeObj.set(prop, value);
            if (activeObj.type !== 'path') { if (prop === 'fill') lastProps.fill = value; if (prop === 'stroke') lastProps.stroke = value; if (prop === 'strokeWidth') lastProps.strokeWidth = value; if (prop === 'opacity') lastProps.opacity = value; } else { if (prop === 'fill') lastArrowProps.fill = value; }
            if (prop === 'fill') highlightPalette('fill-palette', value); if (prop === 'stroke') highlightPalette('stroke-palette', value); if (prop === 'backgroundColor') highlightPalette('text-bg-palette', value);
            canvas.requestRenderAll();
        }

        function deleteActiveObject() { const activeObjects = canvas.getActiveObjects(); if (activeObjects.length) { canvas.discardActiveObject(); activeObjects.forEach(obj => canvas.remove(obj)); } }
        function bringToFront() { const activeObj = canvas.getActiveObject(); if (activeObj) { activeObj.bringToFront(); canvas.discardActiveObject(); canvas.requestRenderAll(); } }
        function sendToBack() { const activeObj = canvas.getActiveObject(); if (activeObj) { activeObj.sendToBack(); canvas.discardActiveObject(); canvas.requestRenderAll(); } }

        document.addEventListener('keydown', function (e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'Delete' || e.key === 'Backspace') {
                const activeObj = canvas.getActiveObject();
                if (activeObj && activeObj.isEditing) return;
                e.preventDefault();
                if (activeObj) deleteActiveObject();
            }
            if (e.key === 'Escape') setMode('select');
        });

        // モーダル
        const modal = document.getElementById('custom-confirm-modal');
        const modalContent = document.getElementById('modal-content');
        const modalMessage = document.getElementById('modal-message');
        const modalConfirmBtn = document.getElementById('modal-confirm-btn');
        const modalButtons = document.getElementById('modal-buttons');
        const loadingIcon = document.getElementById('loading-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalIconContainer = document.getElementById('modal-icon-container');

        let confirmCallback = null;

        function showConfirmModal(message, onConfirm) {
            // 通常モード
            modalTitle.innerText = "確認";
            modalIconContainer.classList.remove('hidden');
            loadingIcon.classList.add('hidden');
            modalButtons.classList.remove('hidden');
            modalMessage.textContent = message;
            confirmCallback = onConfirm;

            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); modalContent.classList.add('scale-100'); }, 10);
        }

        function showLoadingModal(message) {
            // ローディングモード
            modalTitle.innerText = "処理中";
            modalIconContainer.classList.add('hidden');
            loadingIcon.classList.remove('hidden');
            modalButtons.classList.add('hidden'); // ボタン隠す
            modalMessage.textContent = message;

            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); modalContent.classList.add('scale-100'); }, 10);
        }

        function closeConfirmModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
            confirmCallback = null;
        }

        modalConfirmBtn.onclick = () => { if (confirmCallback) confirmCallback(); closeConfirmModal(); };

        // ページ離脱時の確認アラート
        window.addEventListener('beforeunload', function (e) {
            const currentHasObjects = canvas.getObjects().length > 0;
            const hasMultipleTabs = tabs.length > 1;
            if (currentHasObjects || hasMultipleTabs) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // ---------------------------------------------------------
        // 初期化処理の実行 (必ず最後に)
        // ---------------------------------------------------------
        createNewTab();

    </script>
</body>

</html>
